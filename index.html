<!DOCTYPE html>
<html>
<head>
    <title>For Lallisa 💘</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    text-align:center;
    background-image:url('bg.jpg');
    background-size:cover;
    background-position:center;
    overflow:hidden;
    transition:0.5s;
}

.container {
    margin-top:100px;
    background:rgba(255,255,255,0.85);
    padding:30px;
    border-radius:20px;
    display:inline-block;
}

h1 { font-size:26px; }

button {
    padding:12px 25px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

.yes {
    background:#ff4da6;
    color:white;
}

.no {
    background:#444;
    color:white;
    position:absolute;
}

.pink-bg {
    background:pink !important;
}

img {
    max-width:300px;
    border-radius:20px;
    margin-top:20px;
}

.heart {
    position:absolute;
    animation:float 4s linear infinite;
}

@keyframes float {
    0% { transform:translateY(100vh); opacity:1; }
    100% { transform:translateY(-10vh); opacity:0; }
}

#countdown {
    font-size:18px;
    margin-bottom:15px;
    color:#ff1493;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<div class="container" id="mainBox">
    <div id="countdown"></div>
    <h1 id="question">Lallisa, Will you be my valentine? 💘</h1>
    <button class="yes" id="yesBtn" onclick="yesAnswer()">Yes 💖</button>
    <button class="no" id="noBtn" onmouseover="moveNo()">No 😢</button>
</div>

<script>
// Countdown (10 seconds dramatic intro)
let timeLeft = 10;
let countdown = document.getElementById("countdown");

let timer = setInterval(() => {
    countdown.innerHTML = "This moment will change your life in " + timeLeft + "s 💞";
    timeLeft--;
    if(timeLeft < 0) {
        clearInterval(timer);
        countdown.innerHTML = "";
    }
},1000);

// Make Yes button grow slowly
let yesBtn = document.getElementById("yesBtn");
setInterval(()=>{
    let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
    yesBtn.style.fontSize = (currentSize + 1) + "px";
},1500);

// No button runs away
function moveNo(){
    let btn = document.getElementById("noBtn");
    let x = Math.random()*(window.innerWidth-100);
    let y = Math.random()*(window.innerHeight-50);
    btn.style.left = x+"px";
    btn.style.top = y+"px";
}

// YES clicked
function yesAnswer(){
    document.getElementById("bgMusic").play();

    document.body.classList.add("pink-bg");
    document.body.style.backgroundImage="none";

    document.getElementById("mainBox").innerHTML = `
        <h1>Congrats on having a new boyfriend😅</h1>
        <p>
        tunah chuan min kalsan thei i ni tawhlo!!<br>
        Ka inpuang mualpho ve laklawh tawh,<br>
        btw, HAPPY VALENTINES DAY🎀
        </p>
        <img src="photo.jpg">
    `;

    createHearts();
    fireworks();
}

// Floating hearts
function createHearts(){
    setInterval(()=>{
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💖";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(Math.random()*20+20)+"px";
        document.body.appendChild(heart);
        setTimeout(()=>{heart.remove();},4000);
    },300);
}

// Simple fireworks effect
function fireworks(){
    setInterval(()=>{
        let boom=document.createElement("div");
        boom.innerHTML="✨🎆💥";
        boom.style.position="absolute";
        boom.style.left=Math.random()*100+"vw";
        boom.style.top=Math.random()*100+"vh";
        boom.style.fontSize="30px";
        document.body.appendChild(boom);
        setTimeout(()=>{boom.remove();},1000);
    },800);
}
</script>

</body>
</html>
